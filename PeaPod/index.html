<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18152c" />
    <meta
      name="description"
      content="乐观的豌豆荚抖音主播个人介绍页，了解主播的直播气质与内容方向。"
    />
    <title>乐观的豌豆荚 · 抖音主播名片</title>
    <style>
      :root {
        --ink: #f8f6ff;
        --muted: #aaa5bf;
        --soft: #d9d5e8;
        --purple: #8c67ff;
        --pink: #ff76bd;
        --cyan: #7cddff;
        --panel: rgba(28, 24, 54, 0.72);
        --line: rgba(255, 255, 255, 0.12);
        --shadow: 0 24px 80px rgba(7, 4, 24, 0.38);
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, rgba(142, 100, 255, 0.22), transparent 28%),
          radial-gradient(circle at 92% 16%, rgba(255, 101, 173, 0.17), transparent 25%),
          #111022;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        content: "";
        opacity: 0.23;
        background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }

      a { color: inherit; }

      .shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 0;
      }

      .brand {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        color: var(--soft);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: .12em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 10px;
        background: linear-gradient(145deg, var(--pink), var(--purple));
        box-shadow: 0 6px 18px rgba(140, 103, 255, .32);
        font-size: 14px;
      }

      .top-note {
        color: var(--muted);
        font-size: 13px;
      }

      .mark-tag {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 999px;
        color: #d8d0ee;
        background: rgba(255,255,255,.06);
        font-size: 11px;
        letter-spacing: .06em;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(350px, .92fr);
        gap: 56px;
        align-items: center;
        min-height: 620px;
        padding: 66px 0 96px;
      }

      .eyebrow {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        margin: 0 0 22px;
        padding: 8px 12px;
        border: 1px solid rgba(124, 221, 255, .22);
        border-radius: 999px;
        color: var(--cyan);
        background: rgba(124, 221, 255, .08);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .14em;
      }

      .pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #83ecbd;
        box-shadow: 0 0 0 5px rgba(131, 236, 189, .11), 0 0 18px #83ecbd;
      }

      h1, h2, p { margin-top: 0; }

      h1 {
        max-width: 640px;
        margin-bottom: 22px;
        font-size: clamp(44px, 7vw, 82px);
        line-height: 1.05;
        letter-spacing: -.055em;
      }

      h1 em {
        display: block;
        color: transparent;
        font-style: normal;
        background: linear-gradient(105deg, #fff 15%, #caafff 53%, #ff9ccf 92%);
        -webkit-background-clip: text;
        background-clip: text;
      }

      .hero-copy {
        max-width: 560px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.9;
      }

      .hero-copy strong { color: var(--soft); font-weight: 600; }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      .button {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 20px;
        border: 1px solid transparent;
        border-radius: 15px;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      }

      .button:hover { transform: translateY(-3px); }

      .button-primary {
        color: #fff;
        background: linear-gradient(105deg, #7655f5, #bc55d9 58%, #f064b1);
        box-shadow: 0 14px 30px rgba(171, 73, 205, .25);
      }

      .button-primary:hover { box-shadow: 0 18px 38px rgba(171, 73, 205, .4); }

      .button-ghost {
        border-color: var(--line);
        color: var(--soft);
        background: rgba(255,255,255,.045);
      }

      .button-ghost:hover { border-color: rgba(255,255,255,.28); }

      .arrow { font-size: 18px; line-height: 1; }

      .hero-art {
        position: relative;
        min-height: 458px;
      }

      .art-orbit,
      .art-orbit::before,
      .art-orbit::after {
        position: absolute;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 50%;
        transform: rotate(-18deg);
      }

      .art-orbit { inset: 28px 0 30px; }
      .art-orbit::before { content: ""; inset: 50px -24px; border-color: rgba(255, 118, 189, .16); }
      .art-orbit::after { content: ""; inset: -20px 52px; border-color: rgba(124, 221, 255, .13); }

      .profile-card {
        position: absolute;
        inset: 49px 28px 18px 42px;
        overflow: hidden;
        padding: 30px;
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 28px;
        background: linear-gradient(150deg, rgba(54, 42, 95, .87), rgba(24, 22, 48, .82));
        box-shadow: var(--shadow);
        transform: rotate(3deg);
      }

      .profile-card::before {
        position: absolute;
        width: 200px;
        height: 200px;
        top: -90px;
        right: -54px;
        border-radius: 50%;
        content: "";
        background: rgba(255, 118, 189, .16);
        filter: blur(6px);
      }

      .profile-top {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .live-tag {
        display: inline-flex;
        gap: 7px;
        align-items: center;
        padding: 7px 10px;
        border-radius: 10px;
        color: #ffb7d8;
        background: rgba(255, 118, 189, .12);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .1em;
      }

      .tiny-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff76bd; }

      .avatar {
        position: relative;
        display: grid;
        width: 184px;
        height: 184px;
        margin: 38px auto 26px;
        place-items: center;
        border: 1px solid rgba(255,255,255,.24);
        border-radius: 46% 54% 55% 45% / 47% 42% 58% 53%;
        background: linear-gradient(145deg, #6f5bff 5%, #b761dc 56%, #ff81b4 98%);
        box-shadow: 0 0 0 12px rgba(255,255,255,.035), 0 22px 44px rgba(7, 4, 24, .3);
      }

      .avatar::before {
        position: absolute;
        inset: 15px;
        border: 1px solid rgba(255,255,255,.3);
        border-radius: inherit;
        content: "";
      }

      .avatar-photo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: inherit;
        filter: saturate(1.04) contrast(1.03);
      }

      .card-name { position: relative; text-align: center; }
      .card-name h2 { margin-bottom: 3px; font-size: 28px; letter-spacing: -.04em; }
      .card-name p { margin: 0; color: #c4bdd9; font-size: 13px; }

      .card-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 29px;
        padding-top: 22px;
        border-top: 1px solid rgba(255,255,255,.1);
        text-align: center;
      }

      .card-stats strong { display: block; font-size: 17px; }
      .card-stats span { color: #938cae; font-size: 11px; }

      .float-chip {
        position: absolute;
        z-index: 2;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 14px;
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 14px;
        background: rgba(25, 21, 49, .86);
        box-shadow: 0 16px 30px rgba(6, 3, 18, .24);
        color: var(--soft);
        font-size: 12px;
        font-weight: 700;
        backdrop-filter: blur(16px);
      }

      .chip-a { top: 34px; right: -4px; animation: float 5s ease-in-out infinite; }
      .chip-b { bottom: 16px; left: -2px; animation: float 5s 1.2s ease-in-out infinite; }
      .chip-icon { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 9px; background: rgba(124,221,255,.13); color: var(--cyan); }

      @keyframes float { 50% { transform: translateY(-9px); } }

      .section { padding: 28px 0 104px; }

      .section-heading { display: flex; gap: 22px; align-items: end; justify-content: space-between; margin-bottom: 28px; }
      .section-kicker { margin-bottom: 9px; color: var(--pink); font-size: 12px; font-weight: 800; letter-spacing: .16em; }
      .section h2 { margin-bottom: 0; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; letter-spacing: -.045em; }
      .section-intro { max-width: 360px; margin: 0; color: var(--muted); font-size: 14px; text-align: right; }

      .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

      .feature {
        min-height: 190px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 14px 30px rgba(7,4,24,.11);
      }

      .feature:nth-child(2) { transform: translateY(20px); background: linear-gradient(145deg, rgba(57, 38, 85, .72), var(--panel)); }
      .feature:nth-child(3) { background: linear-gradient(145deg, rgba(27, 54, 77, .54), var(--panel)); }
      .feature-icon { display: grid; width: 38px; height: 38px; margin-bottom: 22px; place-items: center; border-radius: 12px; background: rgba(255,255,255,.09); color: var(--cyan); font-size: 18px; }
      .feature:nth-child(2) .feature-icon { color: #ff9bca; }
      .feature:nth-child(3) .feature-icon { color: #b8a3ff; }
      .feature h3 { margin: 0 0 8px; font-size: 18px; }
      .feature p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.75; }

      .about {
        display: grid;
        grid-template-columns: .85fr 1.15fr;
        gap: 18px;
        align-items: stretch;
        margin-top: 88px;
      }

      .about-card { padding: 30px; border: 1px solid var(--line); border-radius: 24px; background: rgba(255,255,255,.045); }
      .about-card h3 { margin: 0 0 15px; font-size: 20px; }
      .about-card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.9; }
      .quote { position: relative; overflow: hidden; background: linear-gradient(145deg, rgba(121, 85, 235, .18), rgba(255, 105, 177, .09)); }
      .quote::after { position: absolute; right: 22px; bottom: -31px; content: "“"; color: rgba(255,255,255,.08); font-family: Georgia, serif; font-size: 160px; line-height: 1; }
      .quote p { position: relative; z-index: 1; max-width: 480px; color: #e7e1f5; font-size: 19px; line-height: 1.7; }
      .quote small { color: #a6a0bd; font-size: 12px; }

      .cta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin: 24px 0 74px;
        padding: 28px 30px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 24px;
        background: linear-gradient(100deg, rgba(103, 79, 204, .24), rgba(255, 99, 175, .13));
      }

      .cta h2 { margin: 0 0 6px; font-size: 23px; }
      .cta p { margin: 0; color: var(--muted); font-size: 13px; }
      .cta .button { flex: 0 0 auto; }

      footer { display: flex; align-items: center; justify-content: space-between; padding: 22px 0 30px; border-top: 1px solid rgba(255,255,255,.1); color: #7f7996; font-size: 12px; }
      footer a { color: var(--soft); text-decoration: none; }

      @media (max-width: 820px) {
        .hero { grid-template-columns: 1fr; gap: 14px; padding-top: 40px; }
        .hero-art { width: min(100%, 560px); margin: 10px auto 0; }
        .feature-grid { grid-template-columns: 1fr; }
        .feature:nth-child(2) { transform: none; }
        .about { grid-template-columns: 1fr; margin-top: 24px; }
        .section-heading { display: block; }
        .section-intro { margin-top: 14px; text-align: left; }
      }

      @media (max-width: 560px) {
        .shell { width: min(100% - 28px, 1120px); }
        .topbar { padding: 20px 0; }
        .top-note { display: none; }
        .hero { min-height: auto; padding: 46px 0 66px; }
        h1 { font-size: 52px; }
        .hero-copy { font-size: 16px; }
        .hero-art { min-height: 400px; transform: scale(.91); transform-origin: top center; margin-bottom: -30px; }
        .profile-card { inset: 46px 13px 18px 22px; padding: 25px; }
        .float-chip { font-size: 11px; }
        .chip-a { right: -8px; }
        .chip-b { left: -9px; }
        .cta { display: block; padding: 24px; }
        .cta .button { margin-top: 20px; }
        footer { display: block; }
        footer a { display: inline-block; margin-top: 9px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="回到页面顶部">
          <span class="brand-mark">✦</span>
          <span>乐观的豌豆荚</span>
        </a>
        <span class="top-note">我的标记 · 乐观的豌豆荚</span>
      </header>

      <main id="top">
        <section class="hero" aria-labelledby="hero-title">
          <div>
            <p class="eyebrow"><span class="pulse"></span> 抖音用户 · 乐观的豌豆荚</p>
            <h1 id="hero-title">乐观的<br /><em>豌豆荚</em></h1>
            <p class="hero-copy">
              <strong>乐观的豌豆荚</strong>是一位抖音主播。点击下方入口即可进入其抖音主页，具体资料以主页内容为准。
            </p>
            <div class="actions">
              <a
                class="button button-primary"
                href="https://www.douyin.com/user/MS4wLjABAAAAizMoAdkJ3YkgxLUfSNNtExVl_Mc9Y7KW0PhKYmUu1ndzuevkbVKc2ClEZ9L50hpi?from_tab_name=main&amp;is_search=0&amp;list_name=follow&amp;nt=0"
                target="_blank"
                rel="noopener noreferrer"
              >
                进入抖音主页 <span class="arrow">↗</span>
              </a>
              <span class="mark-tag">我的标记</span>
            </div>
          </div>

          <div class="hero-art" aria-label="主播风格卡片示意图">
            <div class="art-orbit"></div>
            <article class="profile-card">
              <div class="profile-top">
                <span class="live-tag"><span class="tiny-dot"></span> 主播</span>
                <span class="mark-tag">我的标记</span>
              </div>
              <div class="avatar">
                <img class="avatar-photo" src="avatar.png" alt="乐观的豌豆荚头像" />
              </div>
              <div class="card-name">
                <h2>乐观的豌豆荚</h2>
                <p>抖音主播 · 用直播，把距离变成陪伴</p>
              </div>
            </article>
          </div>
        </section>
      </main>

      <footer>
        <span>我的标记 · 乐观的豌豆荚</span>
        <a href="https://www.douyin.com/user/MS4wLjABAAAAizMoAdkJ3YkgxLUfSNNtExVl_Mc9Y7KW0PhKYmUu1ndzuevkbVKc2ClEZ9L50hpi?from_tab_name=main&amp;is_search=0&amp;list_name=follow&amp;nt=0" target="_blank" rel="noopener noreferrer">打开抖音主页 ↗</a>
      </footer>
    </div>
  </body>
</html>
